<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archivos · SharePoint</title>
<style>
  :root{--bg:#f4f5f7;--card:#ffffff;--text:#16213a;--muted:#5a6478;--line:#e1e5ec;--accent:#2557d6;--accent-soft:#e8eefc;--ok:#1d7a4f;--bad:#b42318}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  .user{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
  .pill{padding:3px 10px;border-radius:999px;font-size:12px;background:var(--accent-soft);color:var(--accent)}
  .pill.ok{background:#e3f4ec;color:var(--ok)}
  button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 14px;border-radius:8px;cursor:pointer}
  button:hover{background:#f0f2f6}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:#1d47b3}
  main{max-width:1200px;margin:0 auto;padding:20px 24px 48px}
  .banner{padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:14px;line-height:1.5}
  .banner.demo{background:#fff6e5;color:#6b4300;border:1px solid #f3d9a4}
  .banner.error{background:#fdecea;color:var(--bad);border:1px solid #f5c2bd}
  .crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:15px;margin-bottom:6px}
  .crumbs a{color:var(--accent);text-decoration:none;cursor:pointer}
  .crumbs a:hover{text-decoration:underline}
  .crumbs .sep{color:var(--muted)}
  .meta{color:var(--muted);font-size:13px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .kpi .label{color:var(--muted);font-size:13px}
  .kpi .value{font-size:26px;font-weight:600;margin-top:4px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-bottom:16px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .panel h2{font-size:15px;margin:0 0 12px;font-weight:600}
  .bar{display:grid;grid-template-columns:150px 1fr 50px;align-items:center;gap:10px;margin-bottom:8px;font-size:13px}
  .bar .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .track{background:#eef1f6;border-radius:6px;height:14px;overflow:hidden}
  .bar .fill{background:var(--accent);height:14px;border-radius:6px}
  .bar .num{text-align:right;color:var(--muted)}
  .tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
  input{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);min-width:260px}
  .tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}
  table{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
  th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  th{background:#f7f8fa;color:var(--muted);font-weight:600;cursor:pointer;user-select:none;position:sticky;top:0;font-size:13px}
  td.n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
  td.nombre a{color:var(--text);text-decoration:none;cursor:pointer}
  td.nombre a:hover{color:var(--accent);text-decoration:underline}
  .tipo{display:inline-block;min-width:44px;text-align:center;font-size:11px;font-weight:600;padding:2px 6px;border-radius:5px;margin-right:10px;background:#eef1f6;color:var(--muted)}
  .tipo.carpeta{background:#fff1d6;color:#8a5a00}.tipo.pdf{background:#fde8e7;color:#b42318}.tipo.excel{background:#e3f4ec;color:#1d7a4f}
  .tipo.word{background:#e8eefc;color:#2557d6}.tipo.ppt{background:#fdeee3;color:#a4400b}.tipo.img{background:#f1e8fd;color:#6b3fb5}
  .ruta{color:var(--muted);font-size:12px}
  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:14px;text-align:center}
  .center p{color:var(--muted);max-width:460px;line-height:1.6;margin:0}
  .hidden{display:none}
  .spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .tabs{background:var(--card);border-bottom:1px solid var(--line);padding:0 24px;display:flex;gap:4px}
  .tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:12px 16px;color:var(--muted);font-weight:600}
  .tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
  .subtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .subtabs button{border-radius:999px;padding:6px 16px}
  .subtabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .fuente{color:var(--muted);font-size:12px;margin:-4px 0 12px}
  .chartbox{position:relative;height:320px}
  .chartbox.alto{height:440px}
  .panel + .panel{margin-top:12px}
  select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text)}
  body.modo-pantera main{max-width:none;padding:0}
  body.modo-pantera #banner:empty{display:none}
  #frPantera{display:block;width:100%;border:0;min-height:calc(100vh - 110px);background:transparent}
  .neg{color:var(--bad)}
  #visor{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:stretch;justify-content:center;z-index:50;padding:24px}
  #visor.hidden{display:none}
  .vbox{background:var(--card);border-radius:14px;width:100%;max-width:1400px;display:flex;flex-direction:column;overflow:hidden}
  .vhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .vhead h2{font-size:16px;margin:0;flex:1;min-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vestado{padding:8px 16px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .vbar{flex:1;min-width:120px;max-width:320px;height:6px;background:#eef1f6;border-radius:4px;overflow:hidden}
  .vbar div{height:6px;background:var(--accent);width:0}
  .vpags{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px;flex:1}
  .vpag{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;border:1px solid var(--line);border-radius:10px;padding:12px}
  .vpag canvas{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
  .vpag pre{white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.55;margin:0;max-height:70vh;overflow:auto}
  .vtag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:#eef1f6;color:var(--muted)}
  .vtag.ocr{background:#fdeee3;color:#a4400b}.vtag.txt{background:#e3f4ec;color:#1d7a4f}
  @media (max-width:800px){.vpag{grid-template-columns:1fr}}
  .pos{color:var(--ok)}
</style>
</head>
<body>
<header>
  <h1 id="titulo">Archivos</h1>
  <div class="user" id="userbox"></div>
</header>
<nav class="tabs hidden" id="tabs">
  <button data-tab="archivos" class="on">Archivos</button>
  <button data-tab="pantera">Pantera</button>
  <span style="flex:1"></span>
  <span id="pInfo" class="hidden" style="align-self:center;color:var(--muted);font-size:13px"></span>
  <button id="pActualizar" class="hidden" style="align-self:center;border:1px solid var(--line);border-radius:8px;padding:7px 14px;margin:6px 0;color:var(--text);font-weight:600">↻ Actualizar</button>
</nav>
<main>
  <div id="banner"></div>

  <section id="vistaLogin" class="center hidden">
    <h2 style="margin:0">Inicia sesión para ver los archivos</h2>
    <p>Usa tu cuenta de Microsoft de la empresa. Los archivos se leen directo de SharePoint y solo ves lo que tu cuenta tiene permitido.</p>
    <button class="primary" id="btnLogin">Iniciar sesión con Microsoft</button>
  </section>

  <section id="vistaCargando" class="center hidden">
    <div class="spin"></div>
    <p id="txtCargando">Cargando…</p>
  </section>

  <section id="vistaPanel" class="hidden">
    <div class="crumbs" id="crumbs"></div>
    <div class="meta">
      <span id="txtOrigen"></span>
      <span id="txtHora"></span>
      <button id="btnRefrescar">Actualizar</button>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="grid2">
      <div class="panel"><h2>Archivos por tipo</h2><div id="barTipo"></div></div>
      <div class="panel"><h2>Modificados por</h2><div id="barPersona"></div></div>
    </div>
    <div class="panel">
      <div class="tools">
        <input type="search" id="buscar" placeholder="Filtrar en esta carpeta">
        <button id="btnBuscarTodo">Buscar en toda la biblioteca</button>
        <span id="txtConteo" style="color:var(--muted);font-size:13px"></span>
      </div>
      <div class="tablewrap"><table id="tabla"></table></div>
    </div>
  </section>

  <div id="visor" class="hidden" role="dialog" aria-modal="true" aria-labelledby="vTitulo">
    <div class="vbox">
      <div class="vhead">
        <h2 id="vTitulo">Documento</h2>
        <button id="vBajar">Descargar texto</button>
        <a id="vAbrir" target="_blank" rel="noopener"><button>Abrir en SharePoint</button></a>
        <button id="vCerrar">Cerrar</button>
      </div>
      <div class="vestado"><span id="vEstado">Preparando…</span><div class="vbar"><div id="vBarra"></div></div></div>
      <div class="vpags" id="vPags"></div>
    </div>
  </div>

  <section id="vistaPantera" class="hidden">
    <iframe id="frPantera" title="Reporte Pantera" scrolling="no"></iframe>
  </section>
</main>

<script>
/* ===================== CONFIGURACIÓN =====================
   Solo cambias este bloque. Ninguno de estos datos es secreto. */
const CONFIG = {
  clientId: "22711e30-33c7-449a-a937-c2c06e483996",   // Dashboard Casos Prueba · Id. de aplicación (cliente)
  tenantId: "0ff454c3-16d0-4731-b6f0-19fecd1cb745",   // Rapi Préstamos S A · Id. de directorio (inquilino)
  sitio: "rapiprestamospty.sharepoint.com/sites/TecnologaRapiPrestamos", // dirección del sitio, sin https://
  biblioteca: "",          // vacío = la biblioteca principal del sitio (Documentos)
  panteraCarpeta: "Proyectos M&CAPITAL/Archivos", // carpeta que lee la sección Pantera
  titulo: "RapiPréstamos · Panel de datos"
};
/* ========================================================= */

const SCOPES = ["Sites.Read.All"];
const GRAPH = "https://graph.microsoft.com/v1.0";
const MSAL_URL = "https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.30.0/lib/msal-browser.min.js";
const CAMPOS = "id,name,size,webUrl,lastModifiedDateTime,lastModifiedBy,folder,file,parentReference";

const $ = id => document.getElementById(id);
const fmtNum = new Intl.NumberFormat("es-PA");
let msalApp = null, cuenta = null, drive = null;
let estado = { ruta: [], items: [], busqueda: null, orden: "name", desc: false };

function esc(v){ return String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
let pestana = "archivos";
function vista(n){
  if (n === "vistaPanel" && pestana === "pantera") n = "vistaPantera";
  ["vistaLogin","vistaCargando","vistaPanel","vistaPantera"].forEach(v => $(v).classList.toggle("hidden", v !== n));
  $("tabs").classList.toggle("hidden", n === "vistaLogin" || n === "vistaCargando");
}
function cargando(t){ $("txtCargando").textContent = t; vista("vistaCargando"); }
function aviso(tipo, html){ $("banner").innerHTML = html ? `<div class="banner ${tipo}">${html}</div>` : ""; }
function esDemo(){ return new URLSearchParams(location.search).has("demo"); }
function tamano(b){ if (b == null) return ""; const u = ["B","KB","MB","GB","TB"]; let i = 0; while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; } return (i ? b.toFixed(1) : b) + " " + u[i]; }
function fecha(iso){ const d = new Date(iso); if (isNaN(d)) return ""; const p = x => String(x).padStart(2, "0"); return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function persona(it){ return (it.lastModifiedBy && it.lastModifiedBy.user && it.lastModifiedBy.user.displayName) || "—"; }
function tipoDe(it){
  if (it.folder) return ["carpeta", "Carpeta"];
  const ext = (it.name.includes(".") ? it.name.split(".").pop() : "").toLowerCase();
  if (ext === "pdf") return ["pdf", "PDF"];
  if (["xlsx","xls","xlsm","csv"].includes(ext)) return ["excel", "Excel"];
  if (["docx","doc"].includes(ext)) return ["word", "Word"];
  if (["pptx","ppt"].includes(ext)) return ["ppt", "PowerPoint"];
  if (["jpg","jpeg","png","gif","webp","heic"].includes(ext)) return ["img", "Imagen"];
  return ["otro", ext ? ext.toUpperCase() : "Otro"];
}

/* ---------- Inicio de sesión (MSAL) ---------- */
function cargarScript(src){
  return new Promise((ok, mal) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => mal(new Error("No se pudo cargar la librería de inicio de sesión de Microsoft. Revisa tu conexión.")); document.head.appendChild(s); });
}
async function iniciarMsal(){
  await cargarScript(MSAL_URL);
  msalApp = new msal.PublicClientApplication({
    auth: { clientId: CONFIG.clientId, authority: `https://login.microsoftonline.com/${CONFIG.tenantId}`, redirectUri: location.origin + location.pathname },
    cache: { cacheLocation: "localStorage" }
  });
  await msalApp.initialize();
  const resp = await msalApp.handleRedirectPromise();
  cuenta = (resp && resp.account) || msalApp.getAllAccounts()[0] || null;
}
async function token(){
  try { return (await msalApp.acquireTokenSilent({ scopes: SCOPES, account: cuenta })).accessToken; }
  catch (e) {
    if (e instanceof msal.InteractionRequiredAuthError) { await msalApp.acquireTokenRedirect({ scopes: SCOPES, account: cuenta }); return new Promise(() => {}); }
    throw e;
  }
}
function pintarUsuario(){
  if (esDemo()) { $("userbox").innerHTML = `<span class="pill">Modo demo</span>`; return; }
  if (!cuenta) { $("userbox").innerHTML = ""; return; }
  $("userbox").innerHTML = `<span>Conectado: ${esc(cuenta.username)}</span><span class="pill ok">Sesión activa</span><button id="btnSalir">Cerrar sesión</button>`;
  $("btnSalir").onclick = salirDelPanel;
}

/* Cierra la sesión SOLO en este panel: borra el inicio de sesión guardado aquí, sin cerrar
   Microsoft en el navegador (Outlook, SharePoint y Teams siguen abiertos). */
async function salirDelPanel(){
  try { if (msalApp && cuenta) await msalApp.logoutRedirect({ account: cuenta, onRedirectNavigate: () => false }); } catch (e) {}
  try { Object.keys(localStorage).filter(k => k.includes(CONFIG.clientId) || k.startsWith("msal.")).forEach(k => localStorage.removeItem(k)); } catch (e) {}
  location.replace(location.origin + location.pathname);
}

/* ---------- Microsoft Graph ---------- */
async function graph(url){
  const r = await fetch(url.startsWith("http") ? url : GRAPH + url, { headers: { Authorization: "Bearer " + await token() } });
  if (r.ok) return r.json();
  let d = ""; try { d = (await r.json()).error.message; } catch (e) {}
  if (r.status === 401 || r.status === 403) throw new Error(`Sin permiso (${r.status}). Revisa que tu cuenta tenga acceso a este sitio. ${d}`);
  if (r.status === 404) throw new Error(`No encontré el sitio o la carpeta (404). Revisa "sitio" en CONFIG. ${d}`);
  throw new Error(`Error ${r.status} al consultar Microsoft: ${d}`);
}
async function todas(url){
  const out = [];
  while (url) { const p = await graph(url); out.push(...(p.value || [])); url = p["@odata.nextLink"] || null; }
  return out;
}
async function abrirBiblioteca(){
  const limpio = CONFIG.sitio.replace(/^https?:\/\//, "").replace(/\/+$/, "");
  const [host, ...resto] = limpio.split("/");
  cargando("Buscando el sitio de SharePoint…");
  const sitio = await graph(resto.length ? `/sites/${host}:/${resto.join("/")}` : `/sites/${host}`);
  if (CONFIG.biblioteca) {
    const drives = await graph(`/sites/${sitio.id}/drives?$select=id,name`);
    drive = (drives.value || []).find(d => d.name.toLowerCase() === CONFIG.biblioteca.toLowerCase());
    if (!drive) throw new Error(`No encontré la biblioteca "${CONFIG.biblioteca}". Disponibles: ${(drives.value || []).map(d => d.name).join(", ")}.`);
  } else {
    drive = await graph(`/sites/${sitio.id}/drive?$select=id,name`);
  }
  return `${sitio.displayName || limpio} · ${drive.name}`;
}
async function leerCarpeta(id){
  if (esDemo()) return demoHijos(id);
  return todas(`/drives/${drive.id}/items/${id}/children?$top=200&$select=${CAMPOS}`);
}
async function buscarTodo(q){
  if (esDemo()) return demoTodos().filter(i => i.name.toLowerCase().includes(q.toLowerCase()));
  const safe = q.replace(/'/g, "''");
  return todas(`/drives/${drive.id}/root/search(q='${encodeURIComponent(safe)}')?$top=200&$select=${CAMPOS}`);
}

/* ---------- Datos de ejemplo (?demo) ---------- */
const DEMO = {
  root: [["f1","Proyectos M&CAPITAL",true],["f2","Avalúos",true],["a1","Inventario de servidores.xlsx"],["a2","Plan de contingencia.docx"]],
  f1: [["f3","Legal",true],["a3","Presentación MYA.pptx"],["a4","Reporte Mensual Pantera.pdf"],["a5","Cartera propiedades.xlsx"]],
  f2: [["a6","Avalúo Finca 1021.pdf"],["a7","Avalúo Lote 7.pdf"],["a8","Foto fachada.jpg"]],
  f3: [["a9","Contrato modelo.docx"],["a10","Casos legales.xlsx"]]
};
function demoItem([id, name, carpeta], i){
  const d = new Date(Date.now() - (i * 9 + id.length * 5) * 864e5).toISOString();
  return { id, name, webUrl: "#", lastModifiedDateTime: d, lastModifiedBy: { user: { displayName: i % 2 ? "Javier Romero" : "Martina" } },
    size: carpeta ? 4200000 + i * 900000 : 80000 + i * 210000, folder: carpeta ? { childCount: (DEMO[id] || []).length } : undefined, file: carpeta ? undefined : {} };
}
function demoHijos(id){ return (DEMO[id] || []).map(demoItem); }
function demoTodos(){ return Object.values(DEMO).flat().map(demoItem); }

/* ---------- Pintado ---------- */
function pintarCrumbs(){
  const partes = [{ id: "root", name: drive ? drive.name : "Documentos" }, ...estado.ruta];
  $("crumbs").innerHTML = partes.map((p, i) => i === partes.length - 1 && !estado.busqueda
    ? `<b>${esc(p.name)}</b>` : `<a data-i="${i}">${esc(p.name)}</a>`).join(`<span class="sep">›</span>`)
    + (estado.busqueda ? `<span class="sep">›</span><b>Resultados de “${esc(estado.busqueda)}”</b>` : "");
  $("crumbs").querySelectorAll("a").forEach(a => a.onclick = () => irA(+a.dataset.i));
}
function barras(cont, pares){
  const max = Math.max(1, ...pares.map(p => p[1]));
  $(cont).innerHTML = pares.slice(0, 8).map(([n, v]) =>
    `<div class="bar"><span class="name" title="${esc(n)}">${esc(n)}</span><div class="track"><div class="fill" style="width:${Math.round(v / max * 100)}%"></div></div><span class="num">${fmtNum.format(v)}</span></div>`).join("")
    || `<p style="color:var(--muted);margin:0">Sin archivos en esta carpeta</p>`;
}
function contar(lista, fn){ const m = new Map(); lista.forEach(x => { const k = fn(x); m.set(k, (m.get(k) || 0) + 1); }); return [...m.entries()].sort((a, b) => b[1] - a[1]); }

function pintarPanel(){
  const items = estado.items, archivos = items.filter(i => !i.folder), carpetas = items.filter(i => i.folder);
  const hace30 = Date.now() - 30 * 864e5;
  const kpis = [
    ["Carpetas", fmtNum.format(carpetas.length)],
    ["Archivos", fmtNum.format(archivos.length)],
    ["Tamaño total", tamano(items.reduce((a, i) => a + (i.size || 0), 0))],
    ["Modificados en 30 días", fmtNum.format(items.filter(i => new Date(i.lastModifiedDateTime).getTime() >= hace30).length)]
  ];
  $("kpis").innerHTML = kpis.map(([l, v]) => `<div class="kpi"><div class="label">${l}</div><div class="value">${v}</div></div>`).join("");
  barras("barTipo", contar(archivos, i => tipoDe(i)[1]));
  barras("barPersona", contar(items, persona));
  pintarCrumbs();
  pintarTabla();
}
function pintarTabla(){
  const q = $("buscar").value.trim().toLowerCase();
  let filas = estado.items.filter(i => !q || i.name.toLowerCase().includes(q));
  const k = estado.orden, s = estado.desc ? -1 : 1;
  filas.sort((a, b) => (!!b.folder - !!a.folder) || s * (k === "size" ? (a.size || 0) - (b.size || 0)
    : k === "fecha" ? new Date(a.lastModifiedDateTime) - new Date(b.lastModifiedDateTime)
    : k === "persona" ? persona(a).localeCompare(persona(b), "es") : a.name.localeCompare(b.name, "es", { numeric: true })));
  $("txtConteo").textContent = `${fmtNum.format(filas.length)} ${filas.length === 1 ? "elemento" : "elementos"}`;
  const flecha = c => estado.orden === c ? (estado.desc ? " ▼" : " ▲") : "";
  const cab = `<thead><tr><th data-k="name">Nombre${flecha("name")}</th><th data-k="fecha">Modificado${flecha("fecha")}</th><th data-k="persona">Modificado por${flecha("persona")}</th><th data-k="size" style="text-align:right">Tamaño${flecha("size")}</th></tr></thead>`;
  const cuerpo = filas.map(i => {
    const [cls, txt] = tipoDe(i);
    const ruta = estado.busqueda && i.parentReference && i.parentReference.path ? `<div class="ruta">${esc(decodeURIComponent(i.parentReference.path.split("root:")[1] || "/"))}</div>` : "";
    const enlace = i.folder ? `<a data-carpeta="${esc(i.id)}" data-nombre="${esc(i.name)}">${esc(i.name)}</a>`
      : /\.pdf$/i.test(i.name) ? `<a data-pdf="${esc(i.id)}" title="Leer el documento (con OCR si es escaneado)">${esc(i.name)}</a>`
      : `<a href="${esc(i.webUrl)}" target="_blank" rel="noopener">${esc(i.name)}</a>`;
    return `<tr><td class="nombre"><span class="tipo ${cls}">${esc(txt)}</span>${enlace}${ruta}</td><td>${fecha(i.lastModifiedDateTime)}</td><td>${esc(persona(i))}</td><td class="n">${i.folder ? `${fmtNum.format(i.folder.childCount || 0)} elem. · ` : ""}${tamano(i.size)}</td></tr>`;
  }).join("");
  $("tabla").innerHTML = cab + `<tbody>${cuerpo || `<tr><td colspan="4" style="color:var(--muted)">Esta carpeta está vacía</td></tr>`}</tbody>`;
  $("tabla").querySelectorAll("th").forEach(th => th.onclick = () => { const c = th.dataset.k; estado.desc = estado.orden === c ? !estado.desc : false; estado.orden = c; pintarTabla(); });
  $("tabla").querySelectorAll("a[data-carpeta]").forEach(a => a.onclick = () => entrar(a.dataset.carpeta, a.dataset.nombre));
  $("tabla").querySelectorAll("a[data-pdf]").forEach(a => a.onclick = () => abrirLector(estado.items.find(x => x.id === a.dataset.pdf)));
}

/* ---------- Lector de PDF con OCR automático ----------
   Al abrir un PDF: cada página se lee con su texto; si la página no trae texto (escaneada),
   se le hace OCR en español dentro del navegador con Tesseract.js. Nada sale de tu computadora. */
const LECTOR = {
  pdfjs: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",
  pdfWorker: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js",
  tesseract: "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js",
  tessWorker: "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js",
  tessCore: "https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1",
  tessIdioma: "https://cdn.jsdelivr.net/npm/@tesseract.js-data/spa@1.0.0/4.0.0_best_int",
  minimoTexto: 25   // menos caracteres que esto en una página = página escaneada
};
const memoriaLectura = new Map();   // id+fecha → [{pagina, metodo, texto}]
let lecturaActual = 0, ocrWorker = null;

async function urlDescarga(item){
  if (item["@microsoft.graph.downloadUrl"]) return item["@microsoft.graph.downloadUrl"];
  if (esDemo()) return window.__demoPdfUrl || null;
  const det = await graph(`/drives/${drive.id}/items/${item.id}`);
  return det["@microsoft.graph.downloadUrl"];
}
async function trabajadorOCR(){
  if (ocrWorker) return ocrWorker;
  if (!window.Tesseract) await cargarScript(LECTOR.tesseract);
  ocrWorker = await Tesseract.createWorker("spa", 1, { workerPath: LECTOR.tessWorker, corePath: LECTOR.tessCore, langPath: LECTOR.tessIdioma });
  return ocrWorker;
}
function cerrarLector(){ lecturaActual++; $("visor").classList.add("hidden"); document.body.style.overflow = ""; }
async function abrirLector(item){
  if (!item) return;
  const yo = ++lecturaActual, clave = item.id + "|" + item.lastModifiedDateTime;
  $("vTitulo").textContent = item.name;
  $("vAbrir").href = item.webUrl && item.webUrl !== "#" ? item.webUrl : "#";
  $("vPags").innerHTML = ""; $("vBarra").style.width = "0";
  $("visor").classList.remove("hidden"); document.body.style.overflow = "hidden";
  const estadoTxt = t => { if (yo === lecturaActual) $("vEstado").textContent = t; };
  const resultado = [];
  $("vBajar").onclick = () => {
    const txt = resultado.map(r => `--- Página ${r.pagina} (${r.metodo}) ---\n${r.texto}`).join("\n\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], { type: "text/plain;charset=utf-8" }));
    a.download = item.name.replace(/\.pdf$/i, "") + ".txt"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  try {
    estadoTxt("Descargando el documento…");
    if (!window.pdfjsLib) { await cargarScript(LECTOR.pdfjs); pdfjsLib.GlobalWorkerOptions.workerSrc = LECTOR.pdfWorker; }
    const url = await urlDescarga(item);
    if (!url) throw new Error("No se pudo obtener el archivo para leerlo.");
    const datos = await (await fetch(url)).arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: datos }).promise;
    const previo = memoriaLectura.get(clave);
    let conOCR = 0;
    for (let n = 1; n <= pdf.numPages; n++) {
      if (yo !== lecturaActual) return;
      const pag = await pdf.getPage(n);
      const vista = pag.getViewport({ scale: 2 });
      const lienzo = document.createElement("canvas"); lienzo.width = vista.width; lienzo.height = vista.height;
      await pag.render({ canvasContext: lienzo.getContext("2d"), viewport: vista }).promise;
      const bloque = document.createElement("div"); bloque.className = "vpag";
      bloque.innerHTML = `<div></div><div><div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><b>Página ${n}</b><span class="vtag" data-tag>Leyendo…</span></div><pre></pre></div>`;
      bloque.firstChild.appendChild(lienzo);
      $("vPags").appendChild(bloque);
      let texto, metodo;
      if (previo && previo[n - 1]) ({ texto, metodo } = previo[n - 1]);
      else {
        const contenido = await pag.getTextContent();
        texto = contenido.items.map(t => t.str + (t.hasEOL ? "\n" : " ")).join("").replace(/[ \t]+\n/g, "\n").trim();
        metodo = "texto del PDF";
        if (texto.replace(/\s/g, "").length < LECTOR.minimoTexto) {
          estadoTxt(`Página ${n} de ${pdf.numPages}: es escaneada, leyendo con OCR…`);
          const w = await trabajadorOCR();
          if (yo !== lecturaActual) return;
          texto = (await w.recognize(lienzo)).data.text.trim();
          metodo = "OCR"; conOCR++;
        }
      }
      resultado.push({ pagina: n, metodo, texto });
      const tag = bloque.querySelector("[data-tag]"); tag.textContent = metodo === "OCR" ? "Leída con OCR" : "Texto del PDF"; tag.classList.add(metodo === "OCR" ? "ocr" : "txt");
      bloque.querySelector("pre").textContent = texto || "(Esta página no tiene texto legible)";
      $("vBarra").style.width = Math.round(n / pdf.numPages * 100) + "%";
      estadoTxt(`Leídas ${n} de ${pdf.numPages} páginas`);
    }
    memoriaLectura.set(clave, resultado);
    estadoTxt(`Listo: ${pdf.numPages} ${pdf.numPages === 1 ? "página" : "páginas"}` + (resultado.some(r => r.metodo === "OCR") ? ` · ${resultado.filter(r => r.metodo === "OCR").length} leídas con OCR` : " · el PDF ya traía texto"));
  } catch (e) {
    estadoTxt("No se pudo leer el documento: " + (e.message || e));
  }
}

/* ---------- Navegación ---------- */
async function mostrar(id){
  try {
    aviso();
    estado.items = await leerCarpeta(id);
    $("txtHora").textContent = "· Actualizado: " + new Date().toLocaleTimeString("es-PA", { hour: "2-digit", minute: "2-digit" });
    vista("vistaPanel");
    pintarPanel();
  } catch (e) { vista("vistaPanel"); aviso("error", esc(e.message || e)); }
}
function carpetaActual(){ return estado.ruta.length ? estado.ruta[estado.ruta.length - 1].id : "root"; }
function entrar(id, name){ if (estado.busqueda) { estado.busqueda = null; estado.ruta = []; } estado.ruta.push({ id, name }); $("buscar").value = ""; mostrar(id); }
function irA(i){ estado.busqueda = null; estado.ruta = estado.ruta.slice(0, i); $("buscar").value = ""; mostrar(carpetaActual()); }
async function buscarEnTodo(){
  const q = $("buscar").value.trim();
  if (!q) { aviso("error", "Escribe algo en el cuadro para buscar en toda la biblioteca."); return; }
  try { aviso(); estado.busqueda = q; estado.items = await buscarTodo(q); $("buscar").value = ""; vista("vistaPanel"); pintarPanel(); }
  catch (e) { aviso("error", esc(e.message || e)); }
}

/* =================== SECCIÓN PANTERA ===================
   La pestaña muestra el Reporte Mensual Pantera completo (pantera.html). Sus datos salen de los
   Excel de CONFIG.panteraCarpeta (y sus subcarpetas), que el reporte lee con este puente. */
window.panelSharePoint = {
  get usuario(){ return esDemo() ? "demo" : (cuenta && cuenta.username) || ""; },
  carpeta: CONFIG.panteraCarpeta,
  async listarExcel(){
    if (esDemo()) { const d = (window.__demoPantera || []).map(a => ({ name: a.name, url: a["@microsoft.graph.downloadUrl"], ruta: "", modificado: a.lastModifiedDateTime })); $("pInfo").textContent = `${d.length} archivos de ejemplo`; return d; }
    const salida = [];
    async function recorrer(ruta, nivel){
      const camino = ruta.split("/").map(encodeURIComponent).join("/");
      const hijos = await todas(`/drives/${drive.id}/root:/${camino}:/children?$top=200`);
      for (const h of hijos) {
        if (h.folder && nivel < 4) await recorrer(ruta + "/" + h.name, nivel + 1);
        else if (h.file && /\.(xlsx|xlsm|xls)$/i.test(h.name) && !h.name.startsWith("~$"))
          salida.push({ name: h.name, url: h["@microsoft.graph.downloadUrl"], ruta, modificado: h.lastModifiedDateTime });
      }
    }
    await recorrer(CONFIG.panteraCarpeta, 0);
    // Del más antiguo al más reciente: si el mismo reporte (deuda, valuación, Data Room…) está en
    // varias carpetas de meses, el último que se lee, y que queda, es el más reciente.
    salida.sort((a, b) => new Date(a.modificado) - new Date(b.modificado));
    const carpetas = new Set(salida.map(x => x.ruta.slice(CONFIG.panteraCarpeta.length + 1)).filter(Boolean));
    $("pInfo").textContent = `${salida.length} archivos de Excel` + (carpetas.size ? ` en ${carpetas.size} ${carpetas.size === 1 ? "carpeta" : "carpetas"}` : "") + ` · leídos ${new Date().toLocaleTimeString("es-PA", { hour: "2-digit", minute: "2-digit" })}`;
    return salida;
  },
  salir(){ salirDelPanel(); }
};

function cambiarPestana(t){
  pestana = t;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  vista(t === "pantera" ? "vistaPantera" : "vistaPanel");
  document.body.classList.toggle("modo-pantera", t === "pantera");
  $("pActualizar").classList.toggle("hidden", t !== "pantera");
  $("pInfo").classList.toggle("hidden", t !== "pantera");
  const fr = $("frPantera");
  if (t === "pantera" && !fr.src) {
    // El reporte se muestra a lo alto completo: la página entera se desplaza, sin barra interna
    fr.onload = () => {
      const doc = fr.contentDocument; if (!doc) return;
      const ajustar = () => { fr.style.height = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight) + "px"; };
      ajustar();
      new ResizeObserver(ajustar).observe(doc.body);
      new MutationObserver(ajustar).observe(doc.body, { childList: true, subtree: true, attributes: true });
      fr.contentWindow.addEventListener("resize", ajustar);
    };
    fr.src = "pantera.html" + (esDemo() ? "?demo" : "");
  }
}

/* ---------- Arranque ---------- */
(async function(){
  document.title = CONFIG.titulo; $("titulo").textContent = CONFIG.titulo;
  $("buscar").oninput = pintarTabla;
  $("buscar").onkeydown = e => { if (e.key === "Enter") buscarEnTodo(); };
  $("btnBuscarTodo").onclick = buscarEnTodo;
  $("btnRefrescar").onclick = () => estado.busqueda ? buscarEnTodo() : mostrar(carpetaActual());
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => cambiarPestana(b.dataset.tab));
  $("vCerrar").onclick = cerrarLector;
  // Vuelve a leer la carpeta de SharePoint (meses o años nuevos) y redibuja el reporte Pantera
  $("pActualizar").onclick = () => { const fr = $("frPantera"); $("pInfo").textContent = "Leyendo SharePoint…"; if (fr.contentWindow) fr.contentWindow.location.reload(); };
  $("visor").onclick = e => { if (e.target.id === "visor") cerrarLector(); };
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("visor").classList.contains("hidden")) cerrarLector(); });

  if (esDemo()) {
    aviso("demo", "<b>Modo demo.</b> Son archivos de ejemplo. Quita <code>?demo</code> de la dirección para ver tus archivos reales.");
    drive = { name: "Documentos" }; $("txtOrigen").textContent = "Origen: ejemplo";
    pintarUsuario(); mostrar("root"); return;
  }
  try {
    cargando("Conectando con Microsoft…");
    await iniciarMsal();
    pintarUsuario();
    $("btnLogin").onclick = () => msalApp.loginRedirect({ scopes: SCOPES, prompt: "select_account" });
    if (!cuenta) { vista("vistaLogin"); return; }
    $("txtOrigen").textContent = "Origen: " + await abrirBiblioteca();
    await mostrar("root");
  } catch (e) {
    vista(cuenta ? "vistaPanel" : "vistaLogin");
    aviso("error", esc(e.message || e));
  }
})();
